<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة اشتراكات ENHAR</title><style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#f5f1e8;font-family:Tahoma,Arial;padding:24px}main{max-width:1100px;margin:auto}h1,h2{color:#f2d88e}.panel{background:#191919;border:1px solid #302a1c;border-radius:12px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.field label{display:block;color:#aaa18f;font-size:12px;margin-bottom:8px}.field input,.field select{width:100%;padding:12px;background:#101010;color:white;border:1px solid #514329;border-radius:8px}button{padding:12px 17px;border:0;border-radius:8px;background:linear-gradient(110deg,#a9873c,#f0d68e);font-weight:bold;cursor:pointer}.secondary{background:#302817;color:#f2d88e;border:1px solid #514329}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.msg{color:#f2d88e;white-space:pre-wrap;margin-top:14px}.muted{color:#aaa18f;font-size:12px;line-height:1.8}table{width:100%;border-collapse:collapse}td,th{text-align:right;padding:11px;border-bottom:1px solid #302a1c;font-size:12px}.wrap{overflow:auto}@media(max-width:600px){body{padding:12px}}</style></head><body><main>
<h1>إدارة اشتراكات ENHAR BUSINESS</h1><p class="muted">لوحة SUPER ADMIN لإدارة الباقات والمدة والإضافات وحالة الاشتراك. كل تعديل يسجل في سجل التدقيق.</p>
<div class="panel"><h2>اختيار المنشأة</h2><div class="field"><label>الشركة المشتركة</label><select id="company"><option>جارٍ التحميل...</option></select></div><div id="summary" class="muted"></div></div>
<div class="panel"><h2>إدارة الباقة</h2><div class="grid">
<div class="field"><label>الباقة والمدة</label><select id="plan"></select></div>
<div class="field"><label>حالة الاشتراك</label><select id="status"><option value="ACTIVE">نشط</option><option value="PAST_DUE">متأخر</option><option value="SUSPENDED">موقوف</option><option value="CANCELLED">ملغي</option><option value="EXPIRED">منتهي</option></select></div>
<div class="field"><label>صناديق إضافية (العدد)</label><input id="cashboxes" type="number" min="0" value="0"></div>
<div class="field"><label>مستخدمون إضافيون (العدد)</label><input id="users" type="number" min="0" value="0"></div>
</div><div class="row"><button id="savePlan">تعيين الباقة والمدة</button><button id="saveStatus" class="secondary">حفظ حالة الاشتراك</button><button id="saveAddons" class="secondary">حفظ الإضافات</button></div><div id="msg" class="msg"></div></div>
<div class="panel"><h2>قائمة الشركات</h2><div class="wrap"><table><thead><tr><th>الرمز</th><th>اسم المنشأة</th><th>الحالة</th><th>الاشتراك</th><th>نهاية التجربة</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="row"><button class="secondary" onclick="location.href='./dashboard.html'">العودة للوحة الرئيسية</button></div>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const client=window.supabase.createClient("https://bibkxfdtmweotjtdrfsg.supabase.co","sb_publishable_bKLWuf9ATcx0zFzYoyvezA_Z_D_vzAB");
const $=id=>document.getElementById(id);let companies=[],plans=[];
async function init(){
 const {data:{session}}=await client.auth.getSession();if(!session){location.href="./index.html";return}
 const {data:isAdmin,error:ae}=await client.rpc("is_platform_admin");if(ae||!isAdmin){document.body.innerHTML="<h2>غير مصرح بالدخول</h2>";return}
 const [c,p]=await Promise.all([
  client.from("enhar_companies").select("id,company_code,name_ar,status,subscription_status,trial_ends_at").order("created_at",{ascending:false}),
  client.from("enhar_subscription_plans").select("id,plan_code,name_ar,billing_period,amount_halalas,cashbox_limit,user_limit").eq("is_active",true).eq("is_test",false).order("amount_halalas")
 ]);
 if(c.error)throw c.error;if(p.error)throw p.error;companies=c.data||[];plans=p.data||[];
 $("company").innerHTML=companies.map(x=>'<option value="'+x.id+'">'+x.name_ar+' · '+x.company_code+'</option>').join("");
 $("plan").innerHTML=plans.map(x=>'<option value="'+x.plan_code+'">'+x.name_ar+' · '+(x.amount_halalas/100).toLocaleString("ar-SA")+' ر.س · '+x.cashbox_limit+' صناديق / '+x.user_limit+' مستخدم</option>').join("");
 $("rows").innerHTML=companies.map(x=>'<tr><td>'+x.company_code+'</td><td>'+x.name_ar+'</td><td>'+x.status+'</td><td>'+x.subscription_status+'</td><td>'+new Date(x.trial_ends_at).toLocaleDateString("ar-SA")+'</td></tr>').join("");
 $("company").onchange=loadSubscription;await loadSubscription();
}
async function loadSubscription(){
 const id=$("company").value;if(!id)return;
 const {data,error}=await client.from("enhar_company_subscriptions").select("plan_id,status,extra_cashboxes,extra_users,current_period_end,enhar_subscription_plans(plan_code,name_ar,cashbox_limit,user_limit)").eq("company_id",id).maybeSingle();
 if(error){$("msg").textContent=error.message;return}
 if(data){$("plan").value=data.enhar_subscription_plans?.plan_code||"";$("status").value=data.status;$("cashboxes").value=data.extra_cashboxes||0;$("users").value=data.extra_users||0;$("summary").textContent="الباقة: "+(data.enhar_subscription_plans?.name_ar||"—")+" | الحد: "+data.enhar_subscription_plans?.cashbox_limit+" صناديق و"+data.enhar_subscription_plans?.user_limit+" مستخدم | الإضافات: "+data.extra_cashboxes+" صندوق و"+data.extra_users+" مستخدم | تنتهي: "+new Date(data.current_period_end).toLocaleDateString("ar-SA")}
 else{$("summary").textContent="لا يوجد اشتراك مدفوع مسجل لهذه المنشأة بعد. يمكنك تعيين باقة يدوياً من هنا.";$("cashboxes").value=0;$("users").value=0}
}
async function act(action,extra){
 const id=$("company").value;if(!id){$("msg").textContent="اختر منشأة أولاً";return}
 $("msg").textContent="جارٍ الحفظ...";
 const {data,error}=await client.rpc("enhar_admin_manage_subscription",{p_company_id:id,p_action:action,p_plan_code:extra?.plan_code||null,p_status:extra?.status||null,p_extra_cashboxes:extra?.cashboxes??null,p_extra_users:extra?.users??null,p_period_end:null});
 $("msg").textContent=error?"فشل الحفظ: "+error.message:"تم الحفظ وتسجيل العملية.";
 if(!error){await loadSubscription();const {data:c}=await client.from("enhar_companies").select("id,company_code,name_ar,status,subscription_status,trial_ends_at").order("created_at",{ascending:false});companies=c||[];$("rows").innerHTML=companies.map(x=>'<tr><td>'+x.company_code+'</td><td>'+x.name_ar+'</td><td>'+x.status+'</td><td>'+x.subscription_status+'</td><td>'+new Date(x.trial_ends_at).toLocaleDateString("ar-SA")+'</td></tr>').join("")}
}
$("savePlan").onclick=()=>act("SET_PLAN",{plan_code:$("plan").value});
$("saveStatus").onclick=()=>act("SET_STATUS",{status:$("status").value});
$("saveAddons").onclick=()=>act("SET_ADDONS",{cashboxes:Number($("cashboxes").value),users:Number($("users").value)});
init().catch(e=>$("msg").textContent="تعذر التحميل: "+e.message);
</script></body></html>
