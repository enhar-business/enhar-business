
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>ENHAR BUSINESS | منصة الأعمال والمحاسبة</title>

  <style>
    :root {
      --black: #080808;
      --panel: #151515;
      --gold: #d7b45f;
      --gold-light: #f3dda0;
      --text: #f7f1e4;
      --muted: #a9a092;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      background:
        radial-gradient(ellipse at top, #302510 0%, transparent 48%),
        var(--black);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 470px;
      text-align: center;
    }

    .main-brand {
      margin-bottom: 25px;
    }

    .main-brand img {
      width: 230px;
      max-width: 85%;
      height: auto;
      display: block;
      margin: auto;
    }

    .main-brand p {
      color: var(--gold-light);
      font-size: 17px;
      margin-top: 12px;
    }

    .login-card {
      background: linear-gradient(145deg, #191919, #101010);
      border: 1px solid #a98a47;
      border-radius: 15px;
      padding: 30px 27px;
      box-shadow: 0 0 35px #c5a04b18;
    }

    .company-box {
      background: #0c0c0c;
      border: 1px solid #806a3c;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 27px;
    }

    .company-logo {
      width: 75px;
      height: 75px;
      border: 1px dashed #9b8045;
      border-radius: 10px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-size: 25px;
      overflow: hidden;
    }

    .company-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .company-box h2 {
      color: var(--gold-light);
      font-size: 20px;
      margin: 8px 0;
    }

    .company-box p {
      color: var(--muted);
      font-size: 13px;
      margin: 0;
    }

    .field {
      text-align: right;
      margin-bottom: 19px;
    }

    .field label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      color: var(--gold-light);
    }

    .field input {
      width: 100%;
      padding: 14px;
      border: 1px solid #776238;
      border-radius: 8px;
      background: #202020;
      color: white;
      font-size: 15px;
      outline: none;
    }

    .field input:focus {
      border-color: var(--gold-light);
      box-shadow: 0 0 0 2px #d7b45f20;
    }

    .login-button {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 15px;
      margin-top: 7px;
      background: linear-gradient(110deg, #a98538, #f0d58c);
      color: #17120a;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:hover {
      filter: brightness(1.08);
    }

    .forgot {
      display: inline-block;
      color: var(--gold-light);
      margin-top: 20px;
      font-size: 13px;
      text-decoration: none;
    }

    .languages {
      margin-top: 22px;
      color: var(--muted);
      font-size: 14px;
    }

    .languages button {
      border: none;
      background: none;
      color: var(--gold-light);
      cursor: pointer;
      font-size: 14px;
      padding: 5px 10px;
    }

    footer {
      color: #8e8269;
      margin-top: 25px;
      font-size: 12px;
      line-height: 2;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 22px 18px;
      }

      .main-brand img {
        width: 195px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="main-brand">
      <img src="./enhar-logo.png" alt="ENHAR BUSINESS" style="width:230px; max-width:85%; height:auto; display:block; margin:auto;">img src="enhar-logo.png" alt="ENHAR BUSINESS">
      <p>منصة الأعمال والمحاسبة</p>
    </header>

    <section class="login-card">

      <div class="company-box">

        <div class="company-logo" id="companyLogo">
          <span>+</span>
        </div>

        <h2 id="companyName">اسم الشركة</h2>

        <p id="companyWelcome">
          مرحباً بك في بوابة شركتك
        </p>

      </div>

      <form id="loginForm">

        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input
            type="email"
            id="email"
            placeholder="أدخل البريد الإلكتروني"
            required
            autocomplete="username"
          >
        </div>

        <div class="field">
          <label for="password">كلمة المرور</label>
          <input
            type="password"
            id="password"
            placeholder="أدخل كلمة المرور"
            required
            autocomplete="current-password"
          >
        </div>

        <button class="login-button" type="submit">
          تسجيل الدخول
        </button>

      </form>

      <a href="#" class="forgot" id="forgotPassword">
        نسيت كلمة المرور؟
      </a>

      <div class="languages">
        <button type="button" id="arabic">العربية</button>
        |
        <button type="button" id="english">English</button>
      </div>

    </section>

    <footer>
      ENHAR BUSINESS<br>
      منصة الأعمال والمحاسبة<br>
      جميع الحقوق محفوظة © 2026
    </footer>

  </main>

  <script>
    /*
      بيانات تجريبية للعرض فقط.
      لاحقاً سنربط الشركة برابطها وبياناتها من قاعدة البيانات.
    */

    const params = new URLSearchParams(window.location.search);

    const company = {
      name: params.get("company") || "اسم الشركة",
      logo: params.get("logo") || ""
    };

    document.getElementById("companyName").textContent =
      company.name;

    if (company.logo) {
      const logo = document.createElement("img");
      logo.src = company.logo;
      logo.alt = "شعار الشركة";

      document.getElementById("companyLogo").replaceChildren(logo);
    }

    document.getElementById("loginForm").addEventListener(
      "submit",
      function(event) {
        event.preventDefault();

        alert(
          "هذه واجهة تجريبية فقط. تسجيل الدخول الحقيقي سيتم تفعيله بعد ربط النظام بقاعدة البيانات."
        );
      }
    );

    document.getElementById("forgotPassword").addEventListener(
      "click",
      function(event) {
        event.preventDefault();
        alert("سيتم تفعيل استعادة كلمة المرور لاحقاً.");
      }
    );

    document.getElementById("english").addEventListener(
      "click",
      function() {
        alert("سيتم استكمال الترجمة الإنجليزية في المرحلة القادمة.");
      }
    );

    document.getElementById("arabic").addEventListener(
      "click",
      function() {
        document.documentElement.lang = "ar";
        document.documentElement.dir = "rtl";
        location.reload();
      }
    );
  </script>

</body>
</html>
