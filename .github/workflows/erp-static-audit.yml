name: ENHAR ERP static safety checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  migration-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit SQL migration versions and table definitions
        run: python scripts/erp_static_audit.py
