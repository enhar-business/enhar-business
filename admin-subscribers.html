<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المشتركين المجانية</title><style>body{margin:0;background:#101010;color:#f5f1e8;font-family:Tahoma;padding:20px}.wrap{max-width:1100px;margin:auto}.panel{background:#191919;border:1px solid #302a1c;border-radius:12px;padding:18px;margin:14px 0}h1,h2{color:#f2d88e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}label{display:block;color:#aaa18f;font-size:12px;margin-bottom:6px}input{width:100%;box-sizing:border-box;padding:11px;background:#101010;color:white;border:1px solid #514329;border-radius:8px}button{padding:10px 14px;border:0;border-radius:8px;background:#d8b45e;color:#16120a;font-weight:bold;cursor:pointer;margin:4px}.secondary{background:#302817;color:#f2d88e}.danger{background:#542b2b;color:white}.muted{color:#aaa18f;font-size:12px;line-height:1.8}.msg{color:#f2d88e;white-space:pre-wrap;margin-top:12px}.table{overflow:auto}table{width:100%;min-width:760px;border-collapse:collapse}td,th{text-align:right;padding:10px;border-bottom:1px solid #302a1c;font-size:12px}</style></head><body><main class="wrap"><h1>إدارة المشتركين المجانية</h1><p class="muted">إنشاء حسابات المشتركين وإدارة مددهم مجاناً من حساب مديرة المنصة.</p><section class="panel"><h2>إضافة مشترك</h2><div class="grid"><div><label>اسم المشترك</label><input id="fullName"></div><div><label>البريد الإلكتروني</label><input id="email" type="email"></div><div><label>اسم المنشأة</label><input id="companyName"></div><div><label>كلمة مرور مؤقتة (12 خانة على الأقل)</label><input id="password" type="password"></div><div><label>نهاية الاشتراك</label><input id="periodEnd" type="date"></div></div><button id="create">إنشاء حساب ومنشأة مجانية</button><div class="msg" id="createMsg"></div><p class="muted">يتم تأكيد الحساب من الإدارة دون إرسال بريد تأكيد. سلّمي كلمة المرور للمشترك بطريقة آمنة واطلبي منه تغييرها.</p></section><section class="panel"><h2>المشتركون</h2><button class="secondary" id="refresh">تحديث القائمة</button><div class="table"><table><thead><tr><th>المنشأة</th><th>البريد</th><th>الرمز</th><th>الحالة</th><th>نهاية المدة</th><th>التحكم</th></tr></thead><tbody id="rows"></tbody></table></div><div class="msg" id="manageMsg"></div></section><section class="panel"><h2>إعادة تعيين كلمة المرور</h2><div class="grid"><div><label>معرّف حساب المشترك</label><input id="userId"></div><div><label>كلمة المرور الجديدة (12 خانة على الأقل)</label><input id="newPassword" type="password"></div></div><button class="secondary" id="reset">تحديث كلمة المرور</button></section><button class="secondary" onclick="location.href='./dashboard.html'">العودة للوحة الرئيسية</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://bibkxfdtmweotjtdrfsg.supabase.co","sb_publishable_bKLWuf9ATcx0zFzYoyvezA_Z_D_vzAB"),$=id=>document.getElementById(id);let list=[];
async function init(){const {data:{session}}=await db.auth.getSession();if(!session){location.href="./index.html";return}const {data:ok,error}=await db.rpc("is_platform_admin");if(error||ok!==true){document.body.innerHTML="<h2>غير مصرح بالدخول</h2>";return}const d=new Date();d.setFullYear(d.getFullYear()+1);$("periodEnd").value=d.toISOString().slice(0,10);await load()}
async function call(body){const {data,error}=await db.functions.invoke("admin-create-subscriber",{body});if(error)throw error;if(data?.error)throw new Error(data.error);return data}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){const d=await call({action:"list_subscribers"});list=d.subscribers||[];$("rows").innerHTML=list.map(x=>'<tr><td>'+esc(x.name_ar)+'</td><td>'+esc(x.owner_email)+'</td><td>'+esc(x.company_code)+'</td><td>'+esc(x.status)+' / '+esc(x.subscription_status)+'</td><td>'+ (x.trial_ends_at?new Date(x.trial_ends_at).toLocaleDateString("ar-SA"):"—")+'</td><td><button data-renew="'+x.id+'">تجديد سنة</button><button class="secondary" data-active="'+x.id+'">تفعيل</button><button class="danger" data-stop="'+x.id+'">إيقاف</button><input type="hidden" data-owner="'+x.id+'" value="'+esc(x.owner_user_id)+'"></td></tr>').join("")||'<tr><td colspan="6">لا يوجد مشتركون</td></tr>';document.querySelectorAll("[data-renew]").forEach(b=>b.onclick=()=>manage(b.dataset.renew,"RENEW"));document.querySelectorAll("[data-active]").forEach(b=>b.onclick=()=>manage(b.dataset.active,"ACTIVATE"));document.querySelectorAll("[data-stop]").forEach(b=>b.onclick=()=>manage(b.dataset.stop,"SUSPEND"))}
async function manage(id,action){if(action==="SUSPEND"&&!confirm("تأكيد إيقاف المنشأة؟"))return;const end=new Date();end.setFullYear(end.getFullYear()+1);try{const {data,error}=await db.rpc("enhar_admin_manage_free_subscription",{p_company_id:id,p_action:action,p_period_end:action==="RENEW"?end.toISOString():null});if(error)throw error;$("manageMsg").textContent="تم تنفيذ العملية";await load()}catch(e){$("manageMsg").textContent="تعذر التنفيذ: "+e.message}}
$("create").onclick=async()=>{const b=$("create");b.disabled=true;$("createMsg").textContent="جارٍ الإنشاء...";try{const d=await call({email:$("email").value,full_name:$("fullName").value,company_name:$("companyName").value,temporary_password:$("password").value,period_end:new Date($("periodEnd").value+"T23:59:59").toISOString()});$("createMsg").textContent="تم إنشاء الحساب. رمز المنشأة: "+d.company.company_code;$("password").value="";await load()}catch(e){$("createMsg").textContent="تعذر الإنشاء: "+e.message}finally{b.disabled=false}};
$("reset").onclick=async()=>{try{await call({action:"reset_password",user_id:$("userId").value,temporary_password:$("newPassword").value});$("manageMsg").textContent="تم تحديث كلمة المرور";$("newPassword").value=""}catch(e){$("manageMsg").textContent="تعذر التحديث: "+e.message}};
$("refresh").onclick=()=>load().catch(e=>$("manageMsg").textContent=e.message);init().catch(e=>$("createMsg").textContent=e.message);
</script></body></html>
